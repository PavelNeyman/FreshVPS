# FreshVPS optional panels — one file, enable with Docker Compose profiles.
# Data plane (sing-box, Blocky) stays on the host.
#
# Usage (after secrets/env substituted by installer):
#   docker compose -f /opt/freshvps/compose/panels.yml --profile kuma --profile beszel up -d
#
# Profiles: opensoho | kuma | beszel | lampac
# All bind 127.0.0.1 — SSH tunnel for admin access.

services:
  opensoho:
    profiles: ["opensoho"]
    image: ${OPENSOHO_IMAGE:-ghcr.io/opensoho/opensoho:latest}
    container_name: opensoho
    restart: unless-stopped
    command: ["serve", "--http", "0.0.0.0:8090", "--dir", "/data"]
    environment:
      OPENSOHO_SHARED_SECRET: ${OPENSOHO_SHARED_SECRET:-}
    ports:
      - "127.0.0.1:${OPENSOHO_HTTP_PORT:-8090}:8090"
    volumes:
      - /var/lib/opensoho:/data

  uptime-kuma:
    profiles: ["kuma"]
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KUMA_PORT:-3001}:3001"
    volumes:
      - /opt/uptime-kuma/data:/app/data
    security_opt:
      - no-new-privileges:true

  beszel:
    profiles: ["beszel"]
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://127.0.0.1:${BESZEL_PORT:-8091}
    ports:
      - "127.0.0.1:${BESZEL_PORT:-8091}:8090"
    volumes:
      - /opt/beszel/hub-data:/beszel_data
      - /opt/beszel/socket:/beszel_socket

  beszel-agent:
    profiles: ["beszel-agent"]
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /opt/beszel/agent-data:/var/lib/beszel-agent
      - /opt/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: "/beszel_socket/beszel.sock"
      HUB_URL: "http://127.0.0.1:${BESZEL_PORT:-8091}"
      KEY: ${BESZEL_KEY:-}
      TOKEN: ${BESZEL_TOKEN:-}

  lampac:
    profiles: ["lampac"]
    image: ${LAMPAC_IMAGE:-ghcr.io/lampac-nextgen/lampac:latest}
    container_name: lampac
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAMPAC_PORT:-9118}:9118"
    shm_size: 128mb
    mem_limit: ${LAMPAC_MEM_LIMIT:-1536m}
    volumes:
      - /opt/lampac/config/passwd:/lampac/passwd
      - /opt/lampac/config/init.conf:/lampac/init.conf
      - /opt/lampac/cache:/lampac/cache
      - /opt/lampac/database:/lampac/database
