# Build and publish netductor (+ legacy tg bot) on version tags.
# Trigger: git tag v0.7.0 && git push origin v0.7.0
name: Release netductor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binaries
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=${VER}" \
            -o dist/netductor-linux-amd64 ./cmd/netductor
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w -X main.version=${VER}" \
            -o dist/netductor-linux-arm64 ./cmd/netductor
          if [ -d cmd/freshvps-tg ]; then
            (cd cmd/freshvps-tg && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../../dist/freshvps-tg-linux-amd64 .)
            (cd cmd/freshvps-tg && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../../dist/freshvps-tg-linux-arm64 .)
          fi
          cd dist && sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, 'dev') || contains(github.ref_name, 'rc') }}
          files: |
            dist/netductor-linux-amd64
            dist/netductor-linux-arm64
            dist/freshvps-tg-linux-amd64
            dist/freshvps-tg-linux-arm64
            dist/SHA256SUMS
          body: |
            ## Netductor ${{ github.ref_name }}

            ### Binaries
            - `netductor-linux-amd64` / `netductor-linux-arm64` — CLI orchestrator
            - `freshvps-tg-linux-*` — Telegram bot (legacy name during migration)

            ```bash
            curl -fsSL -o netductor "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/netductor-linux-amd64"
            chmod +x netductor
            ./netductor version
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
